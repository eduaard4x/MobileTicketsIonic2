<ion-header>
  <ion-toolbar color="dark">
    <ion-title>
      Mobile Tickets
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Emitir Senhas</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-button expand="block" color="danger" (click)="emitirSP()">
        Emitir Senha Prioritária
      </ion-button>

      <ion-button expand="block" color="primary" (click)="emitirSG()">
        Emitir Senha Geral
      </ion-button>

      <ion-button expand="block" color="success" (click)="emitirSE()">
        Emitir Senha Exame
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Filas</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-item>
        <ion-label>
          <strong>Fila SP:</strong>
          {{ getFilaSP() }}
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <strong>Fila SG:</strong>
          {{ getFilaSG() }}
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <strong>Fila SE:</strong>
          {{ getFilaSE() }}
        </ion-label>
      </ion-item>

    </ion-card-content>
  </ion-card>

  <ion-card>

    <ion-card-header>
      <ion-card-title>Painel de Atendimento</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <ion-button
        expand="block"
        color="warning"
        (click)="chamarSenha()">

        Chamar Próxima Senha

      </ion-button>

      <ion-list>

        <ion-item *ngFor="let chamada of getUltimasChamadas()">

          <ion-label>
            {{ chamada }}
          </ion-label>

        </ion-item>

      </ion-list>

    </ion-card-content>

  </ion-card>

</ion-content>
